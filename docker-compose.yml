# boombox: Spotify on a Bluetooth speaker, controlled from Home Assistant.
#
# Portainer: Stacks -> Add stack -> Repository (this repo) or paste this file.
# Environment variables (Portainer "Environment variables" section):
#   DATA_DIR        host folder for state            (default /data/boombox)
#   VNC_PASSWORD    optional: enables noVNC on ports 6091/6092 for debugging.
#                   Logging in is done from Home Assistant (login-helper on
#                   127.0.0.1:8091/8092, see ha/packages/boombox.yaml).
#
# One-time host setup (see README): pair + trust the speaker with the host's
# BlueZ. The pulseaudio container talks to BlueZ over the system D-Bus, which
# Docker's default AppArmor profile blocks, so it runs apparmor=unconfined
# (no extra capabilities or devices; much narrower than privileged).

services:
  pulseaudio:
    image: ghcr.io/milliamp/boombox-pulseaudio:${IMAGE_TAG:-latest}
    container_name: boombox-pulseaudio
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - /run/dbus:/run/dbus
      - ${DATA_DIR:-/data/boombox}/pulse-run:/run/pulse
      - ${DATA_DIR:-/data/boombox}/pulse-state:/root/.config/pulse
    restart: unless-stopped

  # One official Spotify client per account. Each shows up as "Boom" in that
  # account's Spotify device list (the device name is the container hostname).
  spotify-1:
    image: ghcr.io/milliamp/boombox-spotify:${IMAGE_TAG:-latest}
    container_name: boombox-spotify-1
    hostname: ${DEVICE_NAME:-Boom}
    shm_size: 512m
    depends_on: [pulseaudio]
    environment:
      DISPLAY_NUM: "91"
      LOGIN_PORT: "8091"
      NOVNC_PORT: "6091"
      VNC_PASSWORD: ${VNC_PASSWORD:-}
    ports:
      # login-helper for Home Assistant (host network) only: not on the LAN
      - "127.0.0.1:8091:8091"
      - "6091:6091"
    volumes:
      - ${DATA_DIR:-/data/boombox}/spotify-1:/home/spotify
      - ${DATA_DIR:-/data/boombox}/pulse-run:/run/pulse
    restart: unless-stopped

  spotify-2:
    image: ghcr.io/milliamp/boombox-spotify:${IMAGE_TAG:-latest}
    container_name: boombox-spotify-2
    hostname: ${DEVICE_NAME:-Boom}
    shm_size: 512m
    depends_on: [pulseaudio]
    environment:
      DISPLAY_NUM: "92"
      LOGIN_PORT: "8092"
      NOVNC_PORT: "6092"
      VNC_PASSWORD: ${VNC_PASSWORD:-}
    ports:
      # login-helper for Home Assistant (host network) only: not on the LAN
      - "127.0.0.1:8092:8092"
      - "6092:6092"
    volumes:
      - ${DATA_DIR:-/data/boombox}/spotify-2:/home/spotify
      - ${DATA_DIR:-/data/boombox}/pulse-run:/run/pulse
    restart: unless-stopped
