blueprint:
  name: Boombox - play Spotify on the speaker
  description: >-
    Switches the Bluetooth speaker on (or reconnects its audio), picks the
    first Spotify account that isn't playing on another device, moves that
    account's playback to its boombox client and starts a playlist, or resumes
    what the account was playing. When it starts the music it sets the speaker's
    own volume, fading it in once the audio starts (needs the boombox HA package
    for the speaker volume). Returns {account, powered_on} so callers can turn
    the speaker off again only if this script turned it on.
  domain: script
  source_url: https://github.com/milliamp/boombox/blob/main/ha/blueprints/script/boombox_play.yaml
  input:
    speaker_power:
      name: Speaker power switch
      description: e.g. the UE BOOM integration's Power switch
      selector:
        entity:
          domain: switch
    speaker_audio:
      name: Speaker audio connected sensor
      description: e.g. the UE BOOM integration's "Audio connected" sensor
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
    spotify_players:
      name: Spotify accounts
      description: >-
        The Spotify integration's media player for each account. Without an
        `accounts` field they're tried in name order.
      selector:
        entity:
          domain: media_player
          integration: spotify
          multiple: true
    device_name:
      name: Spotify device name
      description: Name the boombox clients show in Spotify (their hostname)
      default: Boom
      selector:
        text:
    default_playlist:
      name: Default playlist
      description: >-
        Spotify URI or open.spotify.com link, used when no playlist is given
        (or when resuming but the account has nothing to resume)
      selector:
        text:
    default_volume:
      name: Default volume (%)
      default: 30
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    speaker_volume:
      name: Speaker volume (%)
      description: >-
        The speaker's own volume, set when this script starts the music
        (rest_command.boombox_speaker_* from the boombox HA package)
      default: 40
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    fade_seconds:
      name: Fade-in (seconds)
      description: Fade the speaker in from silence once the music starts (0 = off)
      default: 10
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: s
    connect_timeout:
      name: Seconds to wait for the audio connection
      description: Time for the speaker to wake and connect its audio
      default: 20
      selector:
        number:
          min: 5
          max: 60

mode: queued
max: 3

fields:
  playlist:
    name: Playlist
    description: Spotify URI or open.spotify.com link (blank = default, or resume)
    required: false
    selector:
      text:
  resume:
    name: Resume
    description: With no playlist, continue what the account was playing instead of the default
    required: false
    default: false
    selector:
      boolean:
  accounts:
    name: Accounts (in order of preference)
    description: Overrides the blueprint's account list and order
    required: false
    selector:
      entity:
        domain: media_player
        integration: spotify
        multiple: true
  speaker_volume:
    name: Speaker volume
    description: The speaker's own volume (blank = the blueprint's default)
    required: false
    selector:
      number:
        min: 0
        max: 100
        unit_of_measurement: "%"
  fade:
    name: Fade-in seconds
    description: Blank = the blueprint's default, 0 = no fade
    required: false
    selector:
      number:
        min: 0
        max: 60
        unit_of_measurement: s
  volume:
    name: Spotify volume
    description: Blank = leave the volume as it is when resuming, else the default
    required: false
    selector:
      number:
        min: 0
        max: 100
        unit_of_measurement: "%"

variables:
  speaker: !input speaker_power
  audio: !input speaker_audio
  all_players: !input spotify_players
  device: !input device_name
  default_playlist: !input default_playlist
  default_volume: !input default_volume
  connect_timeout: !input connect_timeout
  default_speaker_volume: !input speaker_volume
  default_fade: !input fade_seconds
  speaker_level: >-
    {{ (speaker_volume if speaker_volume is defined and speaker_volume not in [none, '']
        else default_speaker_volume) | float }}
  fade_for: >-
    {{ (fade if fade is defined and fade not in [none, ''] else default_fade) | float }}
  want_resume: "{{ resume | default(false) | bool and not (playlist | default('')) }}"
  uri: "{{ playlist if playlist | default('') else default_playlist }}"
  level: >-
    {% if volume is defined and volume not in [none, ''] %}{{ volume | float / 100 }}
    {% elif want_resume %}none{% else %}{{ default_volume | float / 100 }}{% endif %}
  candidates: >-
    {% if accounts is defined and accounts %}{{ accounts if accounts is list else [accounts] }}
    {% else %}{{ expand(all_players) | sort(attribute='name') | map(attribute='entity_id') | list }}{% endif %}
  # The first existing account that isn't playing on a device other than ours.
  account: >-
    {% set ns = namespace(pick='') %}
    {% for p in expand(candidates) %}
      {% if not ns.pick and not (p.state == 'playing' and p.attributes.source != device) %}
        {% set ns.pick = p.entity_id %}
      {% endif %}
    {% endfor %}
    {{ ns.pick }}
  # Did this run switch the speaker on (or reconnect it)? Callers use this to
  # decide whether to switch it off again later.
  powered_on: "{{ not is_state(audio, 'on') }}"
  # Already playing on our speaker (and audible): leave the speaker volume alone.
  already_playing: >-
    {{ account != '' and is_state(audio, 'on') and is_state(account, 'playing')
       and state_attr(account, 'source') == device }}

sequence:
  # Nothing to do if no account is free; report that rather than failing.
  - if: "{{ not account }}"
    then:
      - variables:
          result:
            account: ""
            powered_on: false
      - stop: No Spotify account is free (all missing or playing on another device)
        response_variable: result

  - if: "{{ not already_playing }}"
    then:
      # Spotify can still be "playing" on our client while the speaker is off
      # (into no speaker). Pause it first, or the music would blast out the
      # moment the speaker connects, before the volume is down.
      - if: "{{ is_state(account, 'playing') and state_attr(account, 'source') == device }}"
        then:
          - action: media_player.media_pause
            target:
              entity_id: "{{ account }}"
          - wait_template: "{{ not is_state(account, 'playing') }}"
            timeout: 5
            continue_on_timeout: true
      # Speaker volume, armed before the speaker is on: the volume API holds it
      # at 0 from the moment the speaker connects (it restores its own last
      # volume), then fades in once the music actually plays. Optional: carries
      # on without the boombox package.
      - action: rest_command.boombox_speaker_fade
        continue_on_error: true
        data:
          from: "{{ 0 if fade_for > 0 else speaker_level }}"
          to: "{{ speaker_level }}"
          seconds: "{{ fade_for }}"
          wait: "{{ connect_timeout + 30 }}"

  # Turning the speaker "on" also reconnects its audio if it's on but lost the
  # connection (UE BOOM integration >= 0.2), so do it unless audio is up.
  - if: "{{ powered_on }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: "{{ speaker }}"
      - wait_template: "{{ is_state(audio, 'on') }}"
        timeout:
          seconds: "{{ connect_timeout }}"
        continue_on_timeout: false
      # Let the audio server pick up the new Bluetooth sink and settle at 0.
      - delay:
          seconds: 3

  # Make our client the account's active device first: play_media only targets
  # the active device (with nothing active it picks the account's first device).
  # Transferring keeps the account's queue and play/pause state.
  - if: "{{ state_attr(account, 'source') != device }}"
    then:
      - action: media_player.select_source
        target:
          entity_id: "{{ account }}"
        data:
          source: "{{ device }}"
      - wait_template: "{{ state_attr(account, 'source') == device }}"
        timeout: 15
        continue_on_timeout: true
      - action: homeassistant.update_entity
        target:
          entity_id: "{{ account }}"

  - if: "{{ level != 'none' }}"
    then:
      - action: media_player.volume_set
        target:
          entity_id: "{{ account }}"
        data:
          volume_level: "{{ level }}"

  - if: "{{ want_resume and (state_attr(account, 'media_content_id') or '') != '' }}"
    then:
      # Continue the account's current playlist/album (from the current track).
      - if: "{{ not is_state(account, 'playing') }}"
        then:
          - action: media_player.media_play
            target:
              entity_id: "{{ account }}"
    else:
      - action: media_player.play_media
        target:
          entity_id: "{{ account }}"
        data:
          media_content_id: "{{ uri }}"
          media_content_type: playlist

  - variables:
      result:
        account: "{{ account }}"
        powered_on: "{{ powered_on }}"
  - stop: Playing
    response_variable: result
